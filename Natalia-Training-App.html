<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Train with Coach Natalia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F6F1E7;
    --navy: #1B2A4A;
    --navy-soft: #33506F;
    --gold: #C9A227;
    --gold-soft: #E8D9A8;
    --card: #FFFFFF;
    --line: #E3DAC6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--cream);
    color: var(--navy);
    font-family: 'DM Sans', system-ui, sans-serif;
    line-height: 1.55;
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 20px 80px; }

  header { padding: 30px 0 6px; text-align: center; }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
  }
  .brand {
    font-family: 'EB Garamond', serif;
    font-size: 26px;
    font-weight: 600;
    margin-top: 2px;
  }
  .gold-rule {
    width: 44px; height: 2px;
    background: var(--gold);
    margin: 14px auto 0;
  }
  .tlm-link {
    display: block;
    text-align: center;
    margin: 44px auto 0;
    text-decoration: none;
    color: var(--navy);
  }
  .tlm-mark {
    display: block;
    font-family: 'EB Garamond', serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .tlm-sub {
    display: block;
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    margin-top: 3px;
  }
  .tlm-link:hover .tlm-mark, .tlm-link:focus-visible .tlm-mark { color: var(--navy-soft); }
  .tlm-link:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

  /* Welcome */
  .welcome { text-align: center; padding-top: 26px; }
  .coach-photo {
    display: block;
    width: 190px; height: 190px;
    margin: 6px auto 24px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--gold);
    box-shadow: 0 0 0 7px var(--card), 0 10px 30px rgba(27, 42, 74, 0.18);
  }
  .welcome-eyebrow {
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
  }
  .welcome-title {
    font-family: 'EB Garamond', serif;
    font-size: clamp(36px, 10vw, 48px);
    font-weight: 600;
    line-height: 1.1;
    margin: 4px 0 10px;
  }
  .welcome-sub {
    color: var(--navy-soft);
    font-size: 16px;
    max-width: 42ch;
    margin: 0 auto 30px;
  }
  .cta {
    display: block;
    width: 100%;
    background: var(--navy);
    color: var(--cream);
    border: none;
    border-radius: 12px;
    padding: 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .cta:hover { background: var(--navy-soft); }
  .cta:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .welcome > * { animation: rise 0.5s ease both; }
  .welcome > *:nth-child(2) { animation-delay: 0.08s; }
  .welcome > *:nth-child(3) { animation-delay: 0.16s; }
  .welcome > *:nth-child(4) { animation-delay: 0.24s; }
  .welcome > *:nth-child(5) { animation-delay: 0.32s; }
  .welcome > *:nth-child(6) { animation-delay: 0.4s; }
  .welcome > *:nth-child(7) { animation-delay: 0.48s; }
  .disclaimer {
    font-size: 11px;
    color: var(--navy-soft);
    line-height: 1.55;
    max-width: 46ch;
    margin: 22px auto 0;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .step-count {
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--navy-soft);
    margin: 30px 0 8px;
  }
  .question {
    font-family: 'EB Garamond', serif;
    font-size: clamp(30px, 8vw, 40px);
    font-weight: 600;
    text-align: center;
    line-height: 1.15;
    margin-bottom: 6px;
  }
  .question-sub {
    text-align: center;
    color: var(--navy-soft);
    font-size: 15px;
    margin-bottom: 28px;
  }

  .options { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
    text-align: left;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    color: var(--navy);
    transition: border-color 0.15s ease;
  }
  .opt:hover, .opt:focus-visible { border-color: var(--gold); }
  .opt:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .opt .opt-title { font-size: 17px; font-weight: 700; }
  .opt .opt-sub { font-size: 14px; color: var(--navy-soft); margin-top: 2px; }

  .back-btn {
    background: none; border: none;
    color: var(--navy-soft);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    display: block;
    margin: 26px auto 0;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .back-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* Workout screen */
  .workout-eyebrow {
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    margin-top: 28px;
  }
  .workout-title {
    font-family: 'EB Garamond', serif;
    font-size: clamp(30px, 8vw, 40px);
    font-weight: 600;
    text-align: center;
    line-height: 1.15;
    margin: 4px 0 4px;
  }
  .workout-meta {
    text-align: center;
    color: var(--navy-soft);
    font-size: 14px;
    margin-bottom: 24px;
  }
  .block {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .block-heading {
    font-family: 'EB Garamond', serif;
    font-size: 21px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .block-format {
    font-size: 13px;
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .ex { padding: 10px 0; border-top: 1px solid var(--line); }
  .ex:first-of-type { border-top: none; }
  .ex-name { font-size: 16px; font-weight: 700; }
  .ex-detail { font-size: 14px; color: var(--navy); font-variant-numeric: tabular-nums; }
  .ex-note { font-size: 13px; color: var(--navy-soft); font-style: italic; margin-top: 2px; }

  .coach-note {
    background: var(--navy);
    color: var(--cream);
    border-radius: 14px;
    padding: 16px 20px;
    font-size: 14px;
    margin-bottom: 14px;
  }
  .coach-note strong {
    color: var(--gold);
    display: block;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .restart {
    display: block;
    width: 100%;
    margin-top: 24px;
    background: var(--navy);
    color: var(--cream);
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .restart:hover { background: var(--navy-soft); }
  .restart:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* Timer */
  .timer-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--navy);
    color: var(--cream);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: none;
    z-index: 50;
    box-shadow: 0 -4px 16px rgba(27, 42, 74, 0.25);
  }
  .timer-bar.visible { display: block; }
  .timer-inner {
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
  }
  .timer-label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 2px;
  }
  .timer-display {
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .timer-controls { display: flex; gap: 8px; }
  .timer-btn {
    border: 1px solid var(--gold);
    background: none;
    color: var(--cream);
    border-radius: 8px;
    padding: 8px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .timer-btn:hover, .timer-btn:focus-visible { border-color: var(--cream); }
  .timer-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  body.has-timer .wrap { padding-bottom: 150px; }
  .block-timer-btn {
    margin-top: 12px;
    width: 100%;
    background: var(--cream);
    border: 1px solid var(--gold);
    color: var(--navy);
    border-radius: 10px;
    padding: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .block-timer-btn:hover, .block-timer-btn:focus-visible { background: var(--gold-soft); }
  .block-timer-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  footer {
    margin-top: 44px;
    font-size: 13px;
    color: var(--navy-soft);
    border-top: 1px solid var(--line);
    padding-top: 16px;
    text-align: center;
  }
  .hidden { display: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">The Lazarus Method &middot; Move</div>
    <div class="brand">Train with Coach Natalia</div>
    <div class="gold-rule"></div>
  </header>

  <main id="app"></main>

  <footer>
    Warm up before every session. Questions about form or substitutions? Message Coach Natalia before you improvise.
  </footer>
</div>

<div class="timer-bar" id="timerBar">
  <div class="timer-inner">
    <div>
      <span class="timer-label" id="timerLabel">Block timer</span>
      <span class="timer-display" id="timerDisplay">0:00</span>
    </div>
    <div class="timer-controls">
      <button class="timer-btn" id="timerToggle">Start</button>
      <button class="timer-btn" id="timerReset">Reset</button>
    </div>
  </div>
</div>

<script>
/* ==========================================================
   EDIT YOUR WORKOUTS HERE, NATALIA
   ==========================================================
   The app asks three questions:
     1. equipment:  "equip" (gym / equipment) or "bw" (bodyweight)
     2. time:       15, 30, 45, or 60
     3. focus:      "strength", "metcon", or "combo"

   The workout shown comes from WORKOUTS[equipment][focus][time].
   Every combination below is filled in. To change a workout,
   find its slot and edit the text between quotation marks.

   A slot can hold ONE workout { ... } or a LIST of workouts
   [ { ... }, { ... } ]. When it is a list, the app picks one
   at random and shows a button to swap to the other options.

   TIMERS: every block gets its timer from the FIRST number
   followed by "min" in its format text. Write formats like
   "4 sets in 10 minutes" or "AMRAP 12 minutes" and the block
   timer button appears automatically. A format containing
   "EMOM" also beeps at the top of every minute. A format
   containing "40 sec work, 20 sec rest" (any numbers, sec or
   min, e.g. "3 min work, 1 min rest") beeps high at every work
   start and low at every rest start.

   Each workout has:
     title    - the name shown at the top
     note     - your coaching message for this session
     blocks   - sections of the workout. Each block has:
        heading  - e.g. "Block A" or "Warm Up"
        format   - e.g. "3 sets" or "AMRAP 12 minutes"
        exercises - list of { name, detail, note }
          detail is the sets/reps/rest line
          note is your form cue (optional)

   Keep the commas, quotes, and brackets exactly as they are.
   ========================================================== */
const WORKOUTS = {
  equip: {
    strength: {
      15: { title: "Strength Express", note: "Short on time, not on intent. Move heavy and crisp, rest only as written.",
        blocks: [
          { heading: "Superset", format: "4 rounds in 10 minutes, alternate exercises", exercises: [
            { name: "Goblet Squat", detail: "8 reps, then move on", note: "Heels down, chest tall, control the descent." },
            { name: "Dumbbell Bench Press", detail: "8 reps, rest 45 sec after", note: "Elbows at 45 degrees, full range." } ] },
          { heading: "Finisher", format: "2 rounds in 5 minutes", exercises: [
            { name: "Plank", detail: "40 sec, rest 30 sec", note: "Squeeze glutes, ribs down." } ] } ] },
      30: { title: "Foundation Strength", note: "Go heavy today. Every rep should look identical to the first, so cut the set if form breaks.",
        blocks: [
          { heading: "Block A", format: "4 sets in 10 minutes", exercises: [
            { name: "Dumbbell Deadlift", detail: "6 reps, rest 90 sec", note: "Brace before you pull, flat back." } ] },
          { heading: "Block B", format: "Superset, 3 rounds in 10 minutes", exercises: [
            { name: "Dumbbell Bench Press", detail: "8 reps", note: "Slow 3 second lowering." },
            { name: "Single Arm Row", detail: "10 per side, rest 60 sec after", note: "Pull to your hip, not your armpit." } ] },
          { heading: "Core", format: "2 rounds in 5 minutes", exercises: [
            { name: "Dead Bug", detail: "10 per side, rest 30 sec", note: "Lower back stays glued to the floor." } ] } ] },
      45: [ { title: "Full Strength Session", note: "The main lifts come first while you are fresh. Do not rush block A.",
        blocks: [
          { heading: "Block A", format: "5 sets in 12 minutes", exercises: [
            { name: "Goblet or Barbell Squat", detail: "6 reps, rest 2 min", note: "Last set should feel like a 7 or 8 out of 10." } ] },
          { heading: "Block B", format: "4 sets in 10 minutes", exercises: [
            { name: "Romanian Deadlift", detail: "8 reps, rest 90 sec", note: "Push hips back, stop when hamstrings pull." } ] },
          { heading: "Block C", format: "Superset, 3 rounds in 10 minutes", exercises: [
            { name: "Shoulder Press", detail: "8 reps", note: "No lower back arch." },
            { name: "Lat Pulldown or Row", detail: "10 reps, rest 60 sec after", note: "Drive elbows down, pause at the bottom." } ] },
          { heading: "Core", format: "2 rounds in 5 minutes", exercises: [
            { name: "Side Plank", detail: "30 sec per side, rest 30 sec", note: "Straight line from head to feet." } ] } ] },
        { title: "The Strength Blocks", note: "Three blocks: lower, upper, core. Go heavy where it says heavy. Quality over speed.",
        blocks: [
          { heading: "Block 1: Lower Body", format: "3 to 4 rounds in 15 minutes, rest 45 to 60 sec between", exercises: [
            { name: "Goblet Squat", detail: "10 to 12 reps", note: "Heavy kettlebell or dumbbell." },
            { name: "Romanian Deadlift", detail: "10 to 12 reps", note: "Start from standing." },
            { name: "Alternating Reverse Lunge", detail: "8 to 10 per leg", note: "" },
            { name: "Hip Thrust or Glute Bridge", detail: "12 to 15 reps", note: "" } ] },
          { heading: "Block 2: Upper Body", format: "3 to 4 rounds in 15 minutes, rest 45 to 60 sec between", exercises: [
            { name: "Dumbbell Bench Press", detail: "8 to 12 reps", note: "Heavy kettlebell or dumbbell." },
            { name: "Single Arm Dumbbell Row", detail: "10 per side", note: "" },
            { name: "Dumbbell Push Press", detail: "8 to 12 reps", note: "" },
            { name: "Triceps Extensions", detail: "10 to 15 reps", note: "" } ] },
          { heading: "Block 3: Core", format: "3 to 4 rounds in 8 minutes, rest 30 to 45 sec between", exercises: [
            { name: "V Ups or Sit Ups", detail: "20 total", note: "" },
            { name: "Plank Hold", detail: "30 sec", note: "" },
            { name: "Weighted Russian Twist", detail: "25 total", note: "" },
            { name: "Plank Shoulder Tap", detail: "20 total", note: "" } ] } ] } ],
      60: { title: "Complete Strength Builder", note: "This is the full session. Log your weights so we can progress them next time.",
        blocks: [
          { heading: "Block A", format: "5 sets in 12 minutes", exercises: [
            { name: "Squat", detail: "5 reps, rest 2 min", note: "Build to a challenging but clean top set." } ] },
          { heading: "Block B", format: "4 sets in 12 minutes", exercises: [
            { name: "Bench Press", detail: "6 reps, rest 90 sec", note: "Feet planted, controlled touch, no bounce." } ] },
          { heading: "Block C", format: "3 sets in 8 minutes", exercises: [
            { name: "Romanian Deadlift", detail: "8 reps, rest 90 sec", note: "Soft knees, hinge, not a squat." } ] },
          { heading: "Block D", format: "Superset, 3 rounds in 10 minutes", exercises: [
            { name: "Walking Lunges", detail: "10 per leg", note: "Short steps, knee tracks over toes." },
            { name: "Single Arm Row", detail: "10 per side, rest 60 sec after", note: "Full stretch at the bottom." } ] },
          { heading: "Core", format: "3 rounds in 6 minutes", exercises: [
            { name: "Plank", detail: "45 sec, rest 30 sec", note: "Breathe. Do not hold your breath." } ] } ] }
    },
    metcon: {
      15: [ { title: "The Fast Fifteen", note: "One clock, one gear. Pick weights you can keep moving with.",
        blocks: [
          { heading: "AMRAP", format: "As many rounds as possible in 12 minutes", exercises: [
            { name: "Kettlebell Swing", detail: "15 reps", note: "Snap the hips, arms are just ropes." },
            { name: "Push Ups", detail: "10 reps", note: "Elevate hands if form breaks." },
            { name: "Goblet Squat", detail: "10 reps", note: "Light to moderate, smooth tempo." } ] } ] },
        { title: "The 40/20", note: "Forty seconds on, twenty off, straight down the list until the clock runs out. The timer beeps at every switch.",
        blocks: [
          { heading: "Circuit", format: "12 minutes: 40 sec work, 20 sec rest, rotate through the list", exercises: [
            { name: "Jump Rope", detail: "40 sec", note: "" },
            { name: "Walking Lunges", detail: "40 sec", note: "" },
            { name: "Plank Hold", detail: "40 sec", note: "" },
            { name: "High Knees", detail: "40 sec", note: "" },
            { name: "Kettlebell Swing", detail: "40 sec", note: "" },
            { name: "Wall Sit", detail: "40 sec", note: "" },
            { name: "Mountain Climbers", detail: "40 sec", note: "" },
            { name: "Deadlift", detail: "40 sec", note: "" },
            { name: "Superman", detail: "40 sec", note: "" } ] } ] },
        { title: "The Ladder", note: "One trip down the ladder with jump rope on both ends. Note your finish time and try to beat it next round.",
        blocks: [
          { heading: "For Time", format: "One round for time, 15 minute cap", exercises: [
            { name: "Jump Rope", detail: "100 reps", note: "" },
            { name: "Lunges", detail: "50 total", note: "" },
            { name: "Kettlebell Deadlift", detail: "40 reps", note: "" },
            { name: "Kettlebell Swing", detail: "30 reps", note: "Snap the hips." },
            { name: "Burpees", detail: "20 reps", note: "" },
            { name: "Push Ups", detail: "10 reps", note: "" },
            { name: "Jump Rope", detail: "100 reps", note: "" } ] } ] } ],
      30: [ { title: "Engine Builder", note: "Honest rest periods. Use a timer, not a feeling.",
        blocks: [
          { heading: "Part 1", format: "EMOM 10 minutes, alternate", exercises: [
            { name: "Odd minutes: Kettlebell Swing", detail: "15 reps", note: "" },
            { name: "Even minutes: Burpees", detail: "8 reps", note: "Steady pace you could hold all day." } ] },
          { heading: "Part 2", format: "3 rounds in 12 minutes, rest 60 sec between", exercises: [
            { name: "Dumbbell Thruster", detail: "12 reps", note: "One smooth motion from squat to press." },
            { name: "Row or Jog", detail: "200 m", note: "" },
            { name: "Sit Ups", detail: "15 reps", note: "" } ] } ] },
        { title: "The Pyramid", note: "Up the pyramid, then straight back down. Break sets as needed but keep moving.",
        blocks: [
          { heading: "Warm Up", format: "One round in 5 minutes", exercises: [
            { name: "Inchworm", detail: "5 reps", note: "" },
            { name: "Jump Rope", detail: "50 reps", note: "" },
            { name: "Lunge with Twist", detail: "10 reps", note: "" },
            { name: "Jump Rope", detail: "50 reps", note: "" },
            { name: "Double Pulse Squat", detail: "10 reps", note: "" } ] },
          { heading: "The Pyramid", format: "Up then back down, one round, 15 minute cap", exercises: [
            { name: "Push Ups", detail: "10 reps", note: "" },
            { name: "Alternating Snatch", detail: "20 reps", note: "" },
            { name: "Lunges", detail: "30 total", note: "" },
            { name: "Air Squats", detail: "40 reps", note: "" },
            { name: "Toe Touches", detail: "50 reps", note: "The top of the pyramid." },
            { name: "Then back down", detail: "40 squats, 30 lunges, 20 snatches, 10 push ups", note: "" } ] } ] },
        { title: "The Countdown", note: "Descending ladder for time: 25, then 20, 15, 10, 5, with a run between every round. Note your finish time.",
        blocks: [
          { heading: "For Time", format: "5 descending rounds, 25 minute cap", exercises: [
            { name: "V Ups", detail: "25, 20, 15, 10, 5", note: "" },
            { name: "Lunges", detail: "25, 20, 15, 10, 5 total", note: "" },
            { name: "Push Press", detail: "25, 20, 15, 10, 5", note: "Light enough to keep the sets big." },
            { name: "Run", detail: "200 m each round", note: "Or 60 sec of high knees." } ] } ] } ],
      45: [ { title: "The Grinder", note: "Pace the first two rounds. If round one is your fastest, you went out too hot.",
        blocks: [
          { heading: "Warm Up", format: "2 easy rounds, about 5 minutes", exercises: [
            { name: "Jog or Row", detail: "2 min easy", note: "" },
            { name: "Air Squat + Arm Circles", detail: "10 each", note: "" } ] },
          { heading: "Main Circuit", format: "5 rounds in 24 minutes, rest 90 sec between", exercises: [
            { name: "Kettlebell Swing", detail: "15 reps", note: "" },
            { name: "Dumbbell Thruster", detail: "10 reps", note: "" },
            { name: "Renegade Row", detail: "8 per side", note: "Hips stay square to the floor." },

const app = document.getElementById('app');
const state = { equipment: null, time: null, focus: null };

/* ---- Timer ---- */
const timerBar = document.getElementById('timerBar');
const timerDisplay = document.getElementById('timerDisplay');
const timerLabel = document.getElementById('timerLabel');
const timerToggle = document.getElementById('timerToggle');
let tick = null, remaining = 0, running = false, emomMode = false, audioCtx = null;
let totalSecs = 0, intervalPattern = null;

function beep(freq, dur) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms); }
function fmt(s) {
  const m = Math.floor(s / 60), r = s % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
}
function updateDisplay() { timerDisplay.textContent = fmt(Math.max(remaining, 0)); }

function startCountdown(seconds, label, emom, pattern) {
  clearInterval(tick);
  remaining = seconds;
  totalSecs = seconds;
  intervalPattern = pattern || null;
  emomMode = !!emom;
  running = true;
  timerLabel.textContent = label || 'Timer';
  timerToggle.textContent = 'Pause';
  updateDisplay();
  beep(880, 0.15);
  tick = setInterval(() => {
    if (!running) return;
    remaining--;
    updateDisplay();
    if (remaining <= 0) {
      clearInterval(tick);
      running = false;
      timerToggle.textContent = 'Start';
      timerLabel.textContent = 'Time!';
      beep(660, 0.6); buzz(400);
    } else if (intervalPattern) {
      const elapsed = totalSecs - remaining;
      const cycle = intervalPattern.work + intervalPattern.rest;
      if (elapsed % cycle === 0) { beep(880, 0.25); buzz(200); }
      else if (elapsed % cycle === intervalPattern.work) { beep(520, 0.25); buzz(100); }
    } else if (emomMode && remaining % 60 === 0) {
      beep(880, 0.2); buzz(150);
    } else if (remaining <= 3) {
      beep(440, 0.1);
    }
  }, 1000);
}

timerToggle.addEventListener('click', () => {
  if (remaining > 0) {
    running = !running;
    timerToggle.textContent = running ? 'Pause' : 'Resume';
  }
});
document.getElementById('timerReset').addEventListener('click', () => {
  clearInterval(tick);
  running = false;
  remaining = 0;
  updateDisplay();
  timerLabel.textContent = 'Block timer';
  timerToggle.textContent = 'Start';
});
function showTimer() {
  timerBar.classList.add('visible');
  document.body.classList.add('has-timer');
}
function hideTimer() {
  timerBar.classList.remove('visible');
  document.body.classList.remove('has-timer');
  clearInterval(tick);
  running = false;
  remaining = 0;
  updateDisplay();
  timerLabel.textContent = 'Block timer';
  timerToggle.textContent = 'Start';
}

const STEPS = [
  { key: 'equipment', question: 'What do you have today?', sub: 'Be honest about your setup, both paths work.',
    options: [
      { value: 'equip', title: 'Gym or equipment', sub: 'Dumbbells, kettlebells, or a full gym' },
      { value: 'bw', title: 'Bodyweight only', sub: 'No equipment, anywhere' } ] },
  { key: 'time', question: 'How much time do you have?', sub: 'Including your warm up.',
    options: [
      { value: 15, title: '15 minutes', sub: 'Short and sharp' },
      { value: 30, title: '30 minutes', sub: 'The sweet spot' },
      { value: 45, title: '45 minutes', sub: 'A full session' },
      { value: 60, title: '1 hour', sub: 'The complete workout' } ] },
  { key: 'focus', question: 'What is the focus?', sub: 'Pick the energy you want today.',
    options: [
      { value: 'strength', title: 'Strength', sub: 'Heavier, slower, controlled' },
      { value: 'metcon', title: 'Metcon', sub: 'Conditioning, heart rate, sweat' },
      { value: 'combo', title: 'Combo', sub: 'Strength first, conditioning after' } ] }
];

let currentStep = 0;

function renderStep() {
  hideTimer();
  state.wList = null;
  state.wIndex = undefined;
  const step = STEPS[currentStep];
  app.innerHTML = '';
  const count = document.createElement('div');
  count.className = 'step-count';
  count.textContent = 'Step ' + (currentStep + 1) + ' of 3';
  const q = document.createElement('h1');
  q.className = 'question';
  q.textContent = step.question;
  const sub = document.createElement('p');
  sub.className = 'question-sub';
  sub.textContent = step.sub;
  const opts = document.createElement('div');
  opts.className = 'options';
  step.options.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<div class="opt-title">' + o.title + '</div><div class="opt-sub">' + o.sub + '</div>';
    b.addEventListener('click', () => {
      state[step.key] = o.value;
      if (currentStep < STEPS.length - 1) { currentStep++; renderStep(); }
      else { renderWorkout(); }
      window.scrollTo(0, 0);
    });
    opts.appendChild(b);
  });
  app.append(count, q, sub, opts);
  if (currentStep > 0) {
    const back = document.createElement('button');
    back.className = 'back-btn';
    back.textContent = 'Go back';
    back.addEventListener('click', () => { currentStep--; renderStep(); });
    app.appendChild(back);
  }
}

function renderWorkout() {
  const slot = WORKOUTS[state.equipment][state.focus][state.time];
  const list = Array.isArray(slot) ? slot : [slot];
  if (!state.wList || state.wList !== list || state.wIndex === undefined) {
    state.wList = list;
    state.wIndex = Math.floor(Math.random() * list.length);
  }
  const w = list[state.wIndex];
  const focusLabel = { strength: 'Strength', metcon: 'Metcon', combo: 'Strength + Metcon' }[state.focus];
  const equipLabel = state.equipment === 'bw' ? 'Bodyweight' : 'Equipment';
  app.innerHTML = '';
  const eyebrow = document.createElement('div');
  eyebrow.className = 'workout-eyebrow';
  eyebrow.textContent = 'Your session';
  const title = document.createElement('h1');
  title.className = 'workout-title';
  title.textContent = w.title;
  const meta = document.createElement('p');
  meta.className = 'workout-meta';
  meta.textContent = equipLabel + ' \u00B7 ' + state.time + ' min \u00B7 ' + focusLabel;
  app.append(eyebrow, title, meta);
  if (w.note) {
    const note = document.createElement('div');
    note.className = 'coach-note';
    note.innerHTML = '<strong>From Natalia</strong>' + w.note;
    app.appendChild(note);
  }
  w.blocks.forEach(block => {
    const div = document.createElement('div');
    div.className = 'block';
    div.innerHTML = '<h2 class="block-heading">' + block.heading + '</h2>' +
                    '<div class="block-format">' + block.format + '</div>';
    block.exercises.forEach(ex => {
      const exDiv = document.createElement('div');
      exDiv.className = 'ex';
      exDiv.innerHTML = '<div class="ex-name">' + ex.name + '</div>' +
                        '<div class="ex-detail">' + ex.detail + '</div>' +
                        (ex.note ? '<div class="ex-note">' + ex.note + '</div>' : '');
      div.appendChild(exDiv);
    });
    const tm = block.format.match(/(\d+)\s*min/i);
    if (tm) {
      const tb = document.createElement('button');
      tb.className = 'block-timer-btn';
      tb.textContent = 'Start ' + tm[1] + ' minute block timer';
      const isEmom = /emom/i.test(block.format);
      const wr = block.format.match(/(\d+)\s*(sec|min) work,?\s*(\d+)\s*(sec|min) (?:rest|transition)/i);
      const pattern = wr ? {
        work: parseInt(wr[1], 10) * (wr[2].toLowerCase() === 'min' ? 60 : 1),
        rest: parseInt(wr[3], 10) * (wr[4].toLowerCase() === 'min' ? 60 : 1)
      } : null;
      tb.addEventListener('click', () => startCountdown(parseInt(tm[1], 10) * 60, block.heading, isEmom, pattern));
      div.appendChild(tb);
    }
    app.appendChild(div);
  });
  if (list.length > 1) {
    const swap = document.createElement('button');
    swap.className = 'back-btn';
    swap.textContent = 'Show me a different option';
    swap.addEventListener('click', () => {
      state.wIndex = (state.wIndex + 1) % list.length;
      renderWorkout();
      window.scrollTo(0, 0);
    });
    app.appendChild(swap);
  }
  const restart = document.createElement('button');
  restart.className = 'restart';
  restart.textContent = 'Build another workout';
  restart.addEventListener('click', () => { currentStep = 0; renderStep(); window.scrollTo(0, 0); });
  app.appendChild(restart);
  showTimer();
}

function renderWelcome() {
  hideTimer();
  app.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'welcome';
  div.innerHTML = '<img class="coach-photo" src="' + COACH_PHOTO + '" alt="Coach Natalia">' +
    '<div class="welcome-eyebrow">Welcome</div>' +
    '<h1 class="welcome-title">Let&rsquo;s get to work.</h1>' +
    '<p class="welcome-sub">I&rsquo;m Coach Natalia. Answer three quick questions and I&rsquo;ll hand you today&rsquo;s workout, timers and coaching cues included.</p>';
  const cta = document.createElement('button');
  cta.className = 'cta';
  cta.textContent = 'Build today\'s workout';
  cta.addEventListener('click', () => { currentStep = 0; renderStep(); window.scrollTo(0, 0); });
  div.appendChild(cta);
  const disc = document.createElement('p');
  disc.className = 'disclaimer';
  disc.textContent = 'This app provides general fitness information, not medical advice. Consult your physician before beginning any exercise program. By using these workouts you agree that you do so voluntarily, at your own risk, and that you assume full responsibility for any injury.';
  div.appendChild(disc);
  const logo = document.createElement('a');
  logo.className = 'tlm-link';
  logo.href = 'https://www.lazarusmethod.com';
  logo.target = '_blank';
  logo.rel = 'noopener';
  logo.setAttribute('aria-label', 'The Lazarus Method website');
  logo.innerHTML = '<span class="tlm-mark">The Lazarus Method</span><span class="tlm-sub">lazarusmethod.com</span>';
  div.appendChild(logo);
  app.appendChild(div);
}

renderWelcome();
</script>
</body>
</html>
