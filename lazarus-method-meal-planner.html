<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meal Planner">
<title>Meal Planner | The Lazarus Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap" rel="stylesheet">
<style>
/* Tokens follow lazarus-brand.css v1.1 so this page matches the other tools. */
:root{
  --page:#f3f2f1; --surface:#ffffff; --ink:#0f0f0f; --ink-2:#767676; --ink-3:#b8b8b8;
  --line:#e5e5e5; --lime:#d4f4b3; --danger:#b04a3c; --danger-bg:#f8e9e6;
  --copper:#a8672c; --copper-soft:#f1e4d6; --fatgrey:#8d8a86;
  --r-input:8px; --r-card:10px; --r-pill:999px;
  --display:'General Sans','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --body:'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-0.01em;margin:0;line-height:1.15}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.top{background:var(--ink);color:#fff}
.top-in{max-width:760px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
.top img{width:36px;height:36px;border-radius:50%}
.top-name{font-family:var(--display);font-weight:600;font-size:17px}
.top-sub{color:rgba(255,255,255,.72);font-size:13px}
.top-right{margin-left:auto;font-size:13px;color:rgba(255,255,255,.72)}

.wrap{max-width:760px;margin:0 auto;padding:24px 20px 120px}
.steps{display:flex;gap:6px;margin:4px 0 28px;padding:0;list-style:none}
.steps li{flex:1;font-size:13px;color:var(--ink-2);padding-top:10px;border-top:3px solid var(--line)}
.steps li.on{color:var(--ink);font-weight:600;border-top-color:var(--ink)}
.steps li.done{color:var(--ink);border-top-color:var(--ink)}
.steps li span{display:none}
@media(min-width:560px){.steps li span{display:inline}}

.lead{margin-bottom:20px}
.lead h1{font-size:clamp(30px,6vw,42px)}
.lead p{color:var(--ink-2);margin:10px 0 28px;max-width:56ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:24px;margin-bottom:16px}
.card h2{font-size:20px;margin-bottom:4px}
.card .hint{color:var(--ink-2);font-size:14px;margin:0 0 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}.card{padding:20px 16px}}
label.f{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.inp{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-input);background:#fff;font-size:16px}
.inp:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(15,15,15,.12)}
.row{display:flex;gap:8px}
.unit{position:relative;flex:1}
.unit .inp{padding-right:44px}
.unit i{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--ink-2);font-size:14px;pointer-events:none}

.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.four{grid-template-columns:repeat(4,1fr)}
@media(max-width:520px){.opts.two.stack,.opts.three.stack{grid-template-columns:1fr}.opts.four{grid-template-columns:1fr 1fr}}
.opt{text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r-input);padding:12px 14px;min-height:48px}
.opt b{display:block;font-weight:600;font-size:15px}
.opt small{display:block;color:var(--ink-2);font-size:13px;line-height:1.35;margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt[aria-pressed="true"] b::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin-left:8px;vertical-align:middle}
.opt.center{text-align:center}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:1px solid var(--line);border-radius:var(--r-pill);padding:9px 16px;font-size:15px;min-height:42px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.x::after{content:"×";margin-left:8px;opacity:.7}

.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.check:first-of-type{border-top:0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink);flex-shrink:0}

.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(243,242,241,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:5}
.bar-in{max-width:760px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;align-items:center}
.btn{border:1px solid var(--ink);background:#fff;border-radius:var(--r-pill);padding:12px 22px;font-weight:600;font-size:15px;min-height:46px}
.btn.primary{background:var(--lime);border-color:var(--lime);margin-left:auto}
.btn.primary:hover{filter:brightness(.96)}
.btn.ghost{border-color:var(--line)}
.btn.small{padding:7px 14px;min-height:36px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--danger);font-size:14px;margin:8px 0 0}
.notice{background:var(--danger-bg);color:#6d2a20;border-radius:var(--r-card);padding:16px 18px;font-size:15px;margin-bottom:16px}
.soft{background:#fff;border:1px dashed var(--ink-3);border-radius:var(--r-card);padding:14px 18px;font-size:14px;color:var(--ink-2);margin-bottom:16px}

/* Target panel: the one loud element */
.target{background:var(--ink);color:#fff;border-radius:var(--r-card);padding:26px 24px;margin-bottom:16px}
.target .who{color:rgba(255,255,255,.72);font-size:14px;margin-bottom:10px}
.target .kcal{font-family:var(--display);font-weight:600;font-size:clamp(44px,11vw,68px);line-height:1;letter-spacing:-0.02em}
.target .kcal small{font-family:var(--body);font-size:16px;font-weight:400;color:rgba(255,255,255,.72);letter-spacing:0;margin-left:8px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.macro .g{font-family:var(--display);font-weight:600;font-size:24px}
.macro .n{font-size:13px;color:rgba(255,255,255,.72)}
.macro .track{height:6px;border-radius:3px;background:rgba(255,255,255,.16);margin-top:8px;overflow:hidden}
.macro .fill{height:100%;border-radius:3px}
.fill.p{background:#fff}.fill.c{background:#d99a5b}.fill.f{background:#a9a59f}
.target .why{font-size:13px;color:rgba(255,255,255,.72);margin:18px 0 0;max-width:60ch}

.daytabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;margin:8px 0 4px;scrollbar-width:none}
.daytabs::-webkit-scrollbar{display:none}
.daytab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:var(--r-pill);padding:9px 18px;font-weight:600;font-size:14px}
.daytab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.day h2{font-size:24px;margin:8px 0 14px}
.meal{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);margin-bottom:10px;overflow:hidden}
.meal-h{padding:18px 20px 14px}
.meal-row{display:flex;gap:16px;align-items:flex-start}
.pic{width:104px;height:104px;border-radius:var(--r-input);background:var(--page);flex-shrink:0;overflow:hidden}
.pic svg,.pic img{display:block;width:100%;height:100%;object-fit:cover}
.meal-main{flex:1;min-width:0}
@media(max-width:520px){.pic{width:76px;height:76px}.meal-row{gap:12px}.meal-h{padding:14px 14px 12px}}
.pctrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pctrow small{display:block;color:var(--ink-2);font-size:13px;margin-top:4px}
.sum{font-size:14px;font-weight:600;margin-top:12px}
.sum.bad{color:var(--danger)}
.meal-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.slot{font-size:13px;color:var(--ink-2);font-weight:500}
.meal h3{font-size:19px;margin:2px 0 8px}
.portion{display:inline-block;background:var(--page);border-radius:var(--r-input);padding:6px 10px;font-size:14px;font-weight:500}
.nums{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink-2);margin-top:10px}
.nums b{color:var(--ink);font-weight:600}
.addons{margin:12px 0 0;padding:12px 0 0;border-top:1px solid var(--line);list-style:none;font-size:14px}
.addons li{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.addons li span:last-child{color:var(--ink-2);white-space:nowrap}
.addons .lab{font-weight:600}
details.recipe{border-top:1px solid var(--line)}
details.recipe summary{padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;list-style:none}
details.recipe summary::-webkit-details-marker{display:none}
details.recipe summary::after{content:"+";float:right;font-weight:400;font-size:18px;line-height:1}
details.recipe[open] summary::after{content:"\2212"}
.recipe-body{padding:0 20px 20px;display:grid;grid-template-columns:1fr 1fr;gap:20px;font-size:14px}
@media(max-width:560px){.recipe-body{grid-template-columns:1fr}}
.recipe-body h4{font-size:13px;font-weight:600;margin:0 0 6px;color:var(--ink-2)}
.recipe-body ul{margin:0;padding-left:18px}
.recipe-body li{margin-bottom:3px}
.recipe-body p{margin:0}

.total{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:16px 20px;margin:14px 0 28px}
.total-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;font-weight:600}
.badge{font-size:13px;font-weight:600;border-radius:var(--r-pill);padding:4px 12px;white-space:nowrap}
.badge.ok{background:var(--lime)}
.badge.off{background:var(--copper-soft);color:#6b3f17}
.cmp{display:grid;grid-template-columns:74px 1fr 118px;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.cmp .track{height:8px;background:var(--page);border-radius:4px;position:relative}
.cmp .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ink)}
.cmp .fill.c{background:var(--copper)}.cmp .fill.f{background:var(--fatgrey)}.cmp .fill.k{background:var(--ink)}
.cmp .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);left:80%}
.cmp .val{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cmp .val b{color:var(--ink)}
.legend{font-size:12px;color:var(--ink-2);margin-top:8px}

.tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.section-h{font-size:24px;margin:36px 0 6px}
.section-p{color:var(--ink-2);font-size:14px;margin:0 0 14px}
.groc{columns:2;column-gap:28px;font-size:14px;padding:0;margin:0;list-style:none}
@media(max-width:560px){.groc{columns:1}}
.groc li{break-inside:avoid;margin-bottom:14px}
.groc b{display:block}
.groc small{color:var(--ink-2)}
.groc ul{margin:4px 0 0;padding-left:18px;color:var(--ink-2)}
.shop{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);margin-top:8px}
.shop>summary{padding:16px 20px;font-family:var(--display);font-weight:600;font-size:19px;cursor:pointer;list-style:none}
.shop>summary::-webkit-details-marker{display:none}
.shop>summary::after{content:"+";float:right;font-weight:400}
.shop[open]>summary::after{content:"\2212"}
.shop .section-p,.shop .groc{padding:0 20px}
.shop .groc{padding-bottom:12px}
.foot{font-size:12.5px;color:var(--ink-2);margin-top:36px;border-top:1px solid var(--line);padding-top:16px;max-width:68ch}
.foot p{margin:0 0 8px}
.rx{background:#fff;border:2px solid var(--ink);border-radius:var(--r-card);padding:20px 24px;margin-bottom:16px}
.rx h2{font-size:18px;margin-bottom:4px}
.rx .linkbox{font-size:12px;word-break:break-all;background:var(--page);border-radius:var(--r-input);padding:10px;margin-top:10px;color:var(--ink-2)}
.printonly{display:none}
/* phone comfort: tap targets of at least 44px and readable small text */
.btn.small{min-height:44px;padding:9px 16px;font-size:14px}
.eat,.chip,.daytab{min-height:44px}
.logrow .step button,#app .datenav button{width:44px;height:44px}
.groc small,.res small,.logrow-main small,.todo-main small,.opt small{font-size:13px}
.chart .col .colv,.chart .tline .tlab{font-size:12px}
.xlab{font-size:12.5px}
html{-webkit-text-size-adjust:100%}
button,.opt,.chip,.navb,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media(max-width:520px){
  .wrap{padding:18px 16px 130px}
  .top-in{padding:12px 16px}
  .bar-in{padding-left:16px;padding-right:16px}
  .lead h1{font-size:30px}
  .target{padding:22px 18px}
  .macros{gap:10px}.macro .g{font-size:21px}.macro .n{font-size:12.5px}
  .cmp{grid-template-columns:62px 1fr 104px;gap:8px;font-size:13.5px}
  .tiles{gap:6px}.tile{padding:12px 10px}.tile b{font-size:22px}.tile span{font-size:12.5px}
  .recipe-body{padding:0 14px 16px}details.recipe summary{padding:14px}
  .chooser{padding:14px}
  .how-body{padding:0 16px 16px}.how>summary{padding:14px 16px}
  .meal-actions .btn{flex:1 1 auto}
  .logrow{flex-wrap:wrap}.logrow .logrow-main{flex:1 1 100%}.logrow .step{margin-left:auto}
  .tools .btn{flex:1 1 auto}
}
.meal-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chooser{border-top:1px solid var(--line);padding:16px 20px 18px;background:#fbfaf8}
.chooser .hint{margin:8px 0 0}
.addday{width:100%;border:1px dashed var(--ink-3);background:transparent;border-radius:var(--r-card);padding:14px;font-weight:600;font-size:14px;margin-bottom:10px;min-height:48px}
.how{background:#fff;border:2px solid var(--ink);border-radius:var(--r-card);margin-bottom:16px}
.how>summary{padding:16px 20px;font-family:var(--display);font-weight:600;font-size:18px;cursor:pointer;list-style:none}
.how>summary::-webkit-details-marker{display:none}
.how>summary::after{content:"+";float:right;font-weight:400}
.how[open]>summary::after{content:"\2212"}
.how-body{padding:0 20px 18px;font-size:15px}
.how-body h3{font-size:15px;margin:14px 0 4px}
.how-body h3:first-child{margin-top:0}
.how-body p{margin:0 0 6px;color:#3a3a3a}
.how-body ul{margin:0 0 6px;padding-left:20px;color:#3a3a3a}
.how-body li{margin-bottom:4px}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.navb{border:1px solid var(--line);background:#fff;border-radius:var(--r-pill);padding:11px 6px;font-weight:600;font-size:14px;min-height:46px}
.navb[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar-in{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.hero{background:var(--ink);color:#fff;border-radius:var(--r-card);padding:22px 22px 20px;margin-bottom:16px}
.hero .when{color:rgba(255,255,255,.72);font-size:14px}
.hero .big{font-family:var(--display);font-weight:600;font-size:clamp(40px,11vw,60px);line-height:1.05;letter-spacing:-0.02em;margin-top:6px}
.hero .big small{font-family:var(--body);font-size:15px;font-weight:400;color:rgba(255,255,255,.72);letter-spacing:0;margin-left:8px}
.hero .sub{color:rgba(255,255,255,.72);font-size:14px;margin-top:4px}
.meter{margin-top:14px}
.meter-top{display:flex;justify-content:space-between;font-size:14px;gap:10px}
.meter-top span:last-child{color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums}
.meter .track{height:8px;border-radius:4px;background:rgba(255,255,255,.16);margin-top:6px;position:relative;overflow:hidden}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.h2row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:26px 0 10px}
.h2row h2{font-size:21px}
.h2row span{font-size:13px;color:var(--ink-2)}
.todo{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:12px;margin-bottom:8px}
.todo .pic{width:60px;height:60px}
.todo-main{flex:1;min-width:0}
.todo-main b{display:block;font-family:var(--display);font-weight:600;font-size:16px;line-height:1.25}
.todo-main small{display:block;color:var(--ink-2);font-size:13px;margin-top:2px}
.eat{flex-shrink:0;border:1px solid var(--ink);background:#fff;border-radius:var(--r-pill);padding:9px 14px;font-weight:600;font-size:13px;min-height:40px}
.eat[aria-pressed="true"]{background:var(--lime);border-color:var(--lime)}
.todo.done{background:#fbfdf8}
.results{border:1px solid var(--line);border-radius:var(--r-input);margin-top:8px;overflow:hidden;background:#fff}
.res{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:#fff;border:0;border-top:1px solid var(--line);padding:11px 14px;font-size:14px;min-height:46px;align-items:center}
.res:first-child{border-top:0}
.res small{color:var(--ink-2);white-space:nowrap}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:520px){.grid4{grid-template-columns:1fr 1fr}}
.logrow{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.logrow:first-child{border-top:0}
.logrow-main{flex:1;min-width:0}
.logrow-main b{display:block;font-weight:600}
.logrow-main small{color:var(--ink-2)}
.step{display:flex;align-items:center;gap:4px;flex-shrink:0}
.step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:17px;line-height:1}
.step span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.datenav b{font-family:var(--display);font-weight:600;font-size:18px}
.datenav button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px}
.datenav button:disabled{opacity:.35}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:14px}
.tile b{display:block;font-family:var(--display);font-weight:600;font-size:26px;line-height:1.1}
.tile span{font-size:13px;color:var(--ink-2)}
.chart{position:relative;height:170px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;margin:26px 0 6px;border-bottom:1px solid var(--line)}
.chart .col{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}
.chart .colbar{width:62%;max-width:34px;background:var(--ink);border-radius:4px 4px 0 0;min-height:0}
.chart .colbar.miss{background:var(--ink-3)}
.chart .colv{position:absolute;left:0;right:0;text-align:center;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chart .tline{position:absolute;left:0;right:0;border-top:2px dashed var(--copper);pointer-events:none}
.chart .tlab{position:absolute;right:0;font-size:11px;color:#6b3f17;background:var(--surface);padding:0 4px;transform:translateY(-100%)}
.xlab{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;font-size:12px;color:var(--ink-2);text-align:center}
.xlab .now{color:var(--ink);font-weight:600}
.insight{background:var(--lime);border-radius:var(--r-card);padding:16px 18px;font-size:15px;margin-bottom:16px}
.insight b{display:block;font-family:var(--display);font-weight:600;margin-bottom:2px}

@media print{
  body{background:#fff;font-size:10.5pt}
  .bar,.steps,.tools,.daytabs,.noprint,details.recipe summary::after,.top-right{display:none!important}

    proteinMaxShare: 0.35,
    tolerance: { kcal: 0.05, protein: 0.10, carbs: 0.15, fat: 0.15, gramsSlack: 8 },
    ketoNetCarbPerServing: 12,
  };

  // carbShare = share of the calories left after protein that go to carbohydrate
  const PROTOCOLS = {
    custom: { name: 'Lazarus Method Customized', desc: 'Your own calories and macros', carbShare: 0.50 },
    balanced: { name: 'Balanced', desc: 'Even mix of whole foods', carbShare: 0.50 },
    mediterranean: { name: 'Mediterranean', desc: 'Plants, fish, olive oil', carbShare: 0.56 },
    antiinflammatory: { name: 'Anti-inflammatory', desc: 'No gluten, dairy, or processed meat', carbShare: 0.53 },
    paleo: { name: 'Paleo', desc: 'No grains, legumes, or dairy', carbShare: 0.43 },
    keto: { name: 'Keto', desc: 'Very low carb, high fat', carbShare: null },
    plantbased: { name: 'Plant-based', desc: 'No animal products', carbShare: 0.69 },
    lowfodmap: { name: 'Low FODMAP', desc: 'Gentle on digestion', carbShare: 0.60 },
    zone: { name: 'Zone 40/30/30', desc: '40% carbs, 30% protein, 30% fat', carbShare: null },
  };

  const EXCLUSIONS = [
    { id: 'peanut', label: 'Peanuts', allergen: true },
    { id: 'treenut', label: 'Tree nuts', allergen: true },
    { id: 'dairy', label: 'Dairy', allergen: true },
    { id: 'egg', label: 'Eggs', allergen: true },
    { id: 'gluten', label: 'Gluten', allergen: true },
    { id: 'soy', label: 'Soy', allergen: true },
    { id: 'fish', label: 'Fish', allergen: true },
    { id: 'shellfish', label: 'Shellfish', allergen: true },
    { id: 'sesame', label: 'Sesame', allergen: true },
    { id: 'nightshade', label: 'Nightshades', allergen: false },
    { id: 'pork', label: 'Pork', allergen: false },
    { id: 'redmeat', label: 'Red meat', allergen: false },
  ];

  // ---------- Targets ----------
  function lbToKg(lb) { return lb * 0.45359237; }
  function inToCm(i) { return i * 2.54; }

  function referenceWeightKg(kg, cm) {
    const m = cm / 100, bmi = kg / (m * m);
    if (bmi <= 30) return kg;
    const w25 = 25 * m * m;
    return w25 + 0.25 * (kg - w25); // adjusted body weight
  }

  function macroSplit(kcal, proteinG, protocol) {
    let p = proteinG, c, f;
    if (protocol === 'keto') {
      c = Math.min(45, (kcal * 0.08) / 4);
      f = (kcal - p * 4 - c * 4) / 9;
    } else if (protocol === 'zone') {
      p = Math.max(p, (kcal * 0.30) / 4);
      p = Math.min(p, (kcal * SETTINGS.proteinMaxShare) / 4);
      const rest = kcal - p * 4;
      c = (rest * (40 / 70)) / 4; f = (rest * (30 / 70)) / 9;
    } else {
      const share = (PROTOCOLS[protocol] || PROTOCOLS.balanced).carbShare;
      const rest = kcal - p * 4;
      c = (rest * share) / 4; f = (rest * (1 - share)) / 9;
    }
    return { kcal: Math.round(kcal), p: Math.round(p), c: Math.round(c), f: Math.round(f) };
  }

  /* profile: {sex:'female'|'male', age, heightIn, weightLb, activity, goal, protocol}
     override (practitioner only): {kcal, p, c, f} any subset */
  function computeTargets(profile, override) {
    const kg = lbToKg(profile.weightLb), cm = inToCm(profile.heightIn);
    const notes = [];
    const bmr = 10 * kg + 6.25 * cm - 5 * profile.age + (profile.sex === 'male' ? 5 : -161);
    const tdee = bmr * (SETTINGS.activity[profile.activity] || 1.375);
    let kcal = tdee * (1 + (SETTINGS.goalAdjust[profile.goal] || 0));
    const floor = SETTINGS.calorieFloor[profile.sex] || 1200;
    let floored = false;
    if (kcal < floor) { kcal = floor; floored = true; }
    kcal = Math.round(kcal / 10) * 10;
    const calc = { bmr: Math.round(bmr), tdee: Math.round(tdee), kcal, floor, floored };

    if (override && override.kcal) kcal = override.kcal;

    const refKg = referenceWeightKg(kg, cm);
    const plant = profile.protocol === 'plantbased';
    let protein = refKg * ((plant ? SETTINGS.proteinPerKgPlant : SETTINGS.proteinPerKg)[profile.goal] || 1.4);
    const pFloor = refKg * SETTINGS.proteinFloorPerKg;
    const pCap = (kcal * (plant ? SETTINGS.proteinMaxSharePlant : SETTINGS.proteinMaxShare)) / 4;
    if (protein > pCap) protein = Math.max(pCap, Math.min(pFloor, pCap));
    let t = macroSplit(kcal, protein, profile.protocol);
    if (override && (override.p || override.c || override.f)) {
      t = { kcal: Math.round(kcal), p: override.p || t.p, c: override.c || t.c, f: override.f || t.f };
      t.kcal = override.kcal || Math.round(t.p * 4 + t.c * 4 + t.f * 9);
    }
    return { ...t, calc, proteinFloorG: Math.round(pFloor), refKg, notes };
  }

  // ---------- Food rules ----------
  function dietAllows(item, protocol, isRecipe) {
    const f = item.fl, has = (x) => f.indexOf(x) >= 0;
    const net = item.c - (item.fb || 0);
    switch (protocol) {
      case 'keto': return net <= (isRecipe ? SETTINGS.ketoNetCarbPerServing : 8);
      case 'paleo': return !(has('grain') || has('legume') || has('paleo_no') || has('peanut'));
      case 'plantbased': return !has('animal');
      case 'mediterranean': return !(has('processed') || has('med_no'));
      case 'antiinflammatory': return !(has('processed') || has('med_no') || has('gluten') || has('dairy'));
      case 'lowfodmap': return !has('fodmap');
      default: return true;
    }
  }

  function normWord(w) { return w.toLowerCase().trim().replace(/(es|s)$/,''); }
  function textOf(item) { return (item.name + ' ' + (item.ing || []).join(' ') + ' ' + (item.portion || '')).toLowerCase(); }
  function dislikeHit(item, dislikes) {
    if (!dislikes || !dislikes.length) return false;
    const t = textOf(item);
    return dislikes.some((d) => { const w = normWord(d); return w.length >= 3 && t.indexOf(w) >= 0; });
  }

  function allowed(item, prefs, isRecipe) {
    const ex = prefs.exclusions || [];
    for (let i = 0; i < ex.length; i++) if (item.fl.indexOf(ex[i]) >= 0) return false;
    if (dislikeHit(item, prefs.dislikes)) return false;
    if (item.fl.indexOf('bar') >= 0) {
      // Prima and Lineage bars: flags come from the makers' ingredient lists. Shared production lines are unknown,
      // so they are left out for peanut and tree nut allergies, and for styles their ingredients do not fit.
      if (ex.indexOf('peanut') >= 0 || ex.indexOf('treenut') >= 0) return false;
      return ['keto', 'plantbased', 'lowfodmap', 'antiinflammatory'].indexOf(prefs.protocol) < 0;
    }
    return dietAllows(item, prefs.protocol, isRecipe);
  }

  // ---------- Planner ----------
  function rng(seed) { let s = seed >>> 0 || 1; return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

  const MEAL_SLOTS = { 1: ['dinner'], 2: ['lunch', 'dinner'], 3: ['breakfast', 'lunch', 'dinner'], 4: ['breakfast', 'lunch', 'lunch2', 'dinner'] };
  const SLOT_LABEL = { breakfast: 'Breakfast', lunch: 'Lunch', lunch2: 'Afternoon meal', dinner: 'Dinner', snack: 'Snack' };
  const MULTS = [0.5, 1, 1.5, 2];
  const MULTS_ONE = [1, 1.5, 2, 2.5, 3];

  function sumDay(entries) {
    const t = { kcal: 0, p: 0, c: 0, f: 0, fb: 0 };
    for (const e of entries) { const m = e.mult || 1, x = e.item; t.kcal += x.k * m; t.p += x.p * m; t.c += x.c * m; t.f += x.f * m; t.fb += (x.fb || 0) * m; }
    return t;
  }

  function err(t, target, protocol) {
    const dk = (t.kcal - target.kcal) / target.kcal;
    const dp = (t.p - target.p) / target.p;
    const dc = (t.c - target.c) / Math.max(target.c, 40);
    const df = (t.f - target.f) / Math.max(target.f, 30);
    let s = 3 * dk * dk + (dp < 0 ? 3 : 1.2) * dp * dp + 1.2 * dc * dc + 1.2 * df * df;
    if (protocol === 'keto' && dc > 0) s += 3 * dc * dc;
    return s;
  }

  function withinTolerance(t, target, protocol) {
    const T = SETTINGS.tolerance, g = T.gramsSlack;
    const ok = (v, goal, pct) => Math.abs(v - goal) <= Math.max(goal * pct, g);
    const r = {
      kcal: Math.abs(t.kcal - target.kcal) <= target.kcal * T.kcal,
      p: t.p >= target.p * (1 - T.protein) && t.p <= target.p * 1.25 + g,
      c: protocol === 'keto' ? t.c <= target.c * (1 + T.carbs) + g : ok(t.c, target.c, T.carbs),
      f: ok(t.f, target.f, T.fat),
    };
    r.all = r.kcal && r.p && r.c && r.f;
    return r;
  }

  function buildPools(data, prefs) {
    const all = data.recipes.filter((r) => allowed(r, prefs, true));
    // Simple: 15 minutes or less. Cuisine: the fuller recipes.
    const want = prefs.style === 'cuisine' ? (r) => !r.simple : (r) => r.simple;
    const typed = (types) => {
      const fits = all.filter((r) => types.indexOf(r.type) >= 0);
      const styled = fits.filter(want);
      return styled.length >= 4 ? styled : styled.concat(fits.filter((r) => !want(r))); // too few: borrow from the other style
    };
    const snackFoods = data.snacks.filter((s) => allowed(s, prefs, false));
    const bars = snackFoods.filter((s) => s.fl.indexOf('bar') >= 0);
    const pools = {
      breakfast: typed(['breakfast']),
      lunch: typed(['lunch', 'dinner']),
      dinner: prefs.meals === 1 ? typed(['lunch', 'dinner']) : typed(['dinner']),
      snack: snackFoods.concat(bars, bars).concat(prefs.style === 'cuisine' ? all.filter((r) => r.type === 'snack' || r.type === 'side') : []),
      addon: data.addons.filter((a) => allowed(a, prefs, false)),
    };
    pools.lunch2 = pools.lunch;
    return pools;
  }

  function pick(pool, used, rand, avoid) {
    // weighted random that prefers items not yet used this week
    let best = null, bestScore = -1;
    const tries = Math.min(pool.length, 4);
    for (let i = 0; i < tries; i++) {
      const c = pool[Math.floor(rand() * pool.length)];
      if (avoid && avoid.indexOf(c) >= 0) continue;
      const sc = rand() / (1 + 3 * (used.get(c) || 0));
      if (sc > bestScore) { bestScore = sc; best = c; }
    }
    return best || pool[Math.floor(rand() * pool.length)];
  }

  function fitMultipliers(entries, target, protocol, fixedIdx) {
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 0; i < entries.length; i++) {
        const e = entries[i];
        if (e.slot === 'snack' || e.addon || !e.item.ing || (fixedIdx && fixedIdx.indexOf(i) >= 0)) continue; // only recipes change portion
        let bm = e.mult, bs = Infinity;
        for (const m of (entries._one ? MULTS_ONE : MULTS)) { e.mult = m; const s = err(sumDay(entries), target, protocol); if (s < bs) { bs = s; bm = m; } }
        e.mult = bm;
      }
    }
  }

  function addAddons(entries, pools, target, protocol, slots, max) {
    const ADDON_COST = 0.012;
    for (let n = 0; n < max; n++) {
      const base = err(sumDay(entries), target, protocol);
      let best = null, bestS = base - ADDON_COST;
      for (const a of pools.addon) {
        if (entries.some((e) => e.item === a)) continue;
        const slot = slots.find((s) => s !== 'snack' && a.fits.indexOf(s[0]) >= 0) || (a.fits.indexOf('s') >= 0 ? slots.find((s) => s !== 'snack') : null);
        if (!slot) continue;
        for (const m of [1, 2]) {
          const cand = { item: a, mult: m, addon: true, slot };
          entries.push(cand);
          const s = err(sumDay(entries), target, protocol);
          entries.pop();
          if (s < bestS) { bestS = s; best = cand; }
        }
      }
      if (!best) break;
      entries.push(best);
    }
  }

  function repeatPenalty(entries, used) {
    let p = 0;
    for (const e of entries) if (!e.addon) p += 0.02 * (used.get(e.item) || 0);
    return p;
  }

  function planDay(pools, target, prefs, used, rand, fixed, slotsOv) {
    // fixed: optional array of entries to keep (used when swapping one meal)
    const slots = slotsOv ? slotsOv.slice() : (MEAL_SLOTS[prefs.meals] || MEAL_SLOTS[3]).slice();
    if (!slotsOv) for (let i = 0; i < (prefs.snacks || 0); i++) slots.push('snack');
    let best = null, bestScore = Infinity;
    const iterations = 1200;
    for (let it = 0; it < iterations; it++) {
      const entries = [], chosen = [];
      entries._one = prefs.meals === 1;
      for (let si = 0; si < slots.length; si++) {
        const slot = slots[si];
        if (fixed && fixed[si]) { entries.push({ ...fixed[si] }); chosen.push(fixed[si].item); continue; }
        const pool = pools[slot];
        const item = pick(pool, used, rand, chosen.concat(prefs._avoid || []));
        chosen.push(item);
        entries.push({ item, mult: 1, slot, idx: si });
      }
      if (new Set(chosen).size !== chosen.length) continue;
      const fixedIdx = fixed ? fixed.map((f, i) => (f ? i : -1)).filter((i) => i >= 0) : null;
      fitMultipliers(entries, target, prefs.protocol, null);
      addAddons(entries, pools, target, prefs.protocol, slots, prefs.meals === 1 ? 6 : 4);
      fitMultipliers(entries, target, prefs.protocol, null);
      const score = err(sumDay(entries), target, prefs.protocol) + repeatPenalty(entries, used) + (fixedIdx ? 0 : 0);
      if (score < bestScore) { bestScore = score; best = entries; }
    }
    return best;
  }

  function finishDay(entries, target, protocol) {
    const totals = sumDay(entries);
    return { entries, totals, check: withinTolerance(totals, target, protocol) };
  }

  /* prefs: {protocol, meals:2|3, snacks:0|1|2, days, exclusions:[], dislikes:[], seed} */
  function generatePlan(data, target, prefs) {
    const pools = buildPools(data, prefs);
    const slots = MEAL_SLOTS[prefs.meals] || MEAL_SLOTS[3];
    const missing = slots.filter((s) => pools[s].length < 2);
    if ((prefs.snacks || 0) > 0 && pools.snack.length < 1) missing.push('snack');
    if (missing.length) return { error: 'not_enough', missing, pools };
    const rand = rng(prefs.seed || 12345);
    const used = new Map();
    const days = [];
    for (let d = 0; d < prefs.days; d++) {
      const entries = planDay(pools, target, prefs, used, rand, null);
      if (!entries) return { error: 'not_enough', missing: slots, pools };
      for (const e of entries) if (!e.addon) used.set(e.item, (used.get(e.item) || 0) + 1);
      days.push(finishDay(entries, target, prefs.protocol));
    }
    return { days, pools, target, prefs, poolSizes: { breakfast: pools.breakfast.length, lunch: pools.lunch.length, dinner: pools.dinner.length, snack: pools.snack.length } };
  }

  /* Replace one meal or snack in one day, then rebalance that day's portions and add ons. */
  function swapEntry(data, plan, dayIdx, entryIdx, seed) {
    const prefs = plan.prefs, target = plan.target, pools = plan.pools;
    const day = plan.days[dayIdx];
    const main = day.entries.filter((e) => !e.addon);
    const goner = main[entryIdx];
    const used = new Map();
    plan.days.forEach((dd) => dd.entries.forEach((e) => { if (!e.addon) used.set(e.item, (used.get(e.item) || 0) + 1); }));
    const fixed = main.map((e, i) => (i === entryIdx ? null : { item: e.item, mult: e.mult, slot: e.slot, extra: e.extra }));
    const p2 = { ...prefs, _avoid: [goner.item] };
    const entries = planDay(pools, target, p2, used, rng(seed || Date.now()), fixed, main.map((e) => e.slot));
    if (!entries) return plan;
    plan.days[dayIdx] = finishDay(entries, target, prefs.protocol);
    return plan;
  }

  /* Re-fit one day after the person picks, adds, or removes a food: portions of the other recipes and the sides are re-worked. */
  function rebalance(plan, dayIdx, mainEntries) {
    const prefs = plan.prefs, target = plan.target;
    const entries = mainEntries.map((e) => ({ item: e.item, mult: e.item.ing ? (e.mult || 1) : 1, slot: e.slot, extra: e.extra }));
    entries._one = prefs.meals === 1;
    const slots = entries.map((e) => e.slot);
    fitMultipliers(entries, target, prefs.protocol, null);
    addAddons(entries, plan.pools, target, prefs.protocol, slots, prefs.meals === 1 ? 6 : 4);
    fitMultipliers(entries, target, prefs.protocol, null);
    plan.days[dayIdx] = finishDay(entries, target, prefs.protocol);
    return plan;
  }
  function mainOf(plan, dayIdx) { return plan.days[dayIdx].entries.filter((e) => !e.addon); }
  function chooseEntry(plan, dayIdx, entryIdx, item) { const m = mainOf(plan, dayIdx); if (!m[entryIdx]) return plan; m[entryIdx] = { item: item, mult: 1, slot: m[entryIdx].slot, extra: m[entryIdx].extra }; return rebalance(plan, dayIdx, m); }
  function addExtra(plan, dayIdx, item) { const m = mainOf(plan, dayIdx); m.push({ item: item, mult: 1, slot: 'snack', extra: true }); return rebalance(plan, dayIdx, m); }
  function removeEntry(plan, dayIdx, entryIdx) { const m = mainOf(plan, dayIdx); if (!m[entryIdx] || !m[entryIdx].extra) return plan; m.splice(entryIdx, 1); return rebalance(plan, dayIdx, m); }

  function weekAverage(plan) {
    const n = plan.days.length, t = { kcal: 0, p: 0, c: 0, f: 0 };
    plan.days.forEach((d) => { t.kcal += d.totals.kcal / n; t.p += d.totals.p / n; t.c += d.totals.c / n; t.f += d.totals.f / n; });
    return t;
  }

  return { chooseEntry, addExtra, removeEntry, SETTINGS, PROTOCOLS, EXCLUSIONS, SLOT_LABEL, computeTargets, macroSplit, generatePlan, swapEntry, weekAverage, withinTolerance, buildPools, allowed, sumDay, lbToKg, inToCm };
})();
if (typeof module !== 'undefined') module.exports = LM;

  // how many pieces fill a whole dish, and piece scale
  const SPEC = {

    bacon: [4, 1], sausage: [9, 1], deli: [4, 1], pepperoni: [9, 1], ground: [22, 1], patty: [2, 1.15], tofu: [10, 1], tempeh: [7, 1], beans: [34, 1], chickpeas: [28, 1], whitebeans: [26, 1], lentils: [40, 1], edamame: [26, 1],
    broccoli: [9, 1], cauliflower: [9, 1], brussels: [10, 1], asparagus: [6, 1], greenbeans: [9, 1], zucchini: [11, 1], cucumber: [10, 1], pepper: [10, 1], gpepper: [9, 1], tomato: [10, 1], onion: [12, 1], mushroom: [9, 1],
    carrot: [12, 1], celery: [10, 1], jicama: [9, 1], potato: [11, 1], sweetpotato: [11, 1], avocado: [5, 1], blueberry: [26, 1], redberry: [18, 1], mixedberry: [24, 1], banana: [10, 1], apple: [6, 1], mango: [12, 1], grapes: [16, 1],
    dates: [7, 1], olives: [12, 1], tortilla: [2, 1], bread: [2, 1], mixedveg: [22, 1], greens: [20, 1], pepitas: [46, 1.15], nuts: [30, 1.15], seeds: [70, 1.2], coconut: [40, 1.2], cacao: [30, 1.2],
  };
  const BED = { curds: 1, greens: 1, rice: 1, brownrice: 1, quinoa: 1, oats: 1, creamy: 1, zoodle: 1, noodle: 1, caulirice: 1, cabbage: 1, redcabbage: 1 };
  const TOP = { pepitas: 12, nuts: 9, seeds: 26, coconut: 16, cacao: 14, cheese: 16, whitecheese: 10, herbs: 14, scallion: 8 };
  const PROTEIN = 'jerky chicken steak pork salmon whitefish shrimp tuna sardine egg eggs eggb bacon sausage deli pepperoni ground patty tofu tempeh'.split(' ');

  function inDisc(r, R) { const a = r() * Math.PI * 2, d = Math.sqrt(r()) * R; return [Math.cos(a) * d, Math.sin(a) * d]; }

  function bed(kind, cx, cy, R, r, clipId) {
    let s = '';
    const fillBase = (c) => circ(cx, cy, R, c);
    if (kind === 'greens') {
      s += fillBase('#5e9b46');
      const cols = ['#3f7d38', '#6fae4f', '#8cc463', '#4f8f3f', '#a4d17a'];
      for (let i = 0; i < 46; i++) { const p = inDisc(r, R - 3), c = cols[Math.floor(r() * cols.length)]; const rot = r() * 360; s += g(cx + p[0], cy + p[1], rot, '<path d="M-7 0 Q0 -5.5 7 0 Q0 5.5 -7 0Z" fill="' + c + '"/>' + line('M-5 0 L5 0', 'rgba(255,255,255,.28)', .6)); }
    } else if (kind === 'rice' || kind === 'brownrice' || kind === 'quinoa' || kind === 'caulirice') {
      const base = { rice: '#f6f1e3', brownrice: '#dcc39a', quinoa: '#e6d3a6', caulirice: '#f3eedd' }[kind];
      const grain = { rice: '#ffffff', brownrice: '#c4a373', quinoa: '#c9ae75', caulirice: '#fffdf5' }[kind];
      const shade = { rice: '#e2d9c2', brownrice: '#b8956a', quinoa: '#b89a5d', caulirice: '#ddd4bb' }[kind];
      s += fillBase(base);
      for (let i = 0; i < 150; i++) { const p = inDisc(r, R - 1.5); if (kind === 'quinoa' || kind === 'caulirice') s += circ(cx + p[0], cy + p[1], 0.9 + r() * 0.5, r() < 0.5 ? grain : shade); else s += ell(cx + p[0], cy + p[1], 2.1, 0.8, r() * 180, r() < 0.6 ? grain : shade); }
    } else if (kind === 'oats') {
      s += fillBase('#e9d7b0');
      for (let i = 0; i < 90; i++) { const p = inDisc(r, R - 2); s += ell(cx + p[0], cy + p[1], 2.4, 1.6, r() * 180, r() < 0.5 ? '#f4e8c9' : '#d3ba87'); }
    } else if (kind === 'creamy') {
      s += fillBase('#fbf8f0');
      s += '<path d="M' + f(cx) + ' ' + f(cy) + ' m-' + f(R * 0.62) + ' 0 a' + f(R * 0.62) + ' ' + f(R * 0.62) + ' 0 1 1 ' + f(R * 0.5) + ' ' + f(R * 0.5) + ' a' + f(R * 0.36) + ' ' + f(R * 0.36) + ' 0 1 1 -' + f(R * 0.2) + ' -' + f(R * 0.5) + ' a' + f(R * 0.16) + ' ' + f(R * 0.16) + ' 0 1 1 ' + f(R * 0.12) + ' ' + f(R * 0.22) + '" fill="none" stroke="#e4dcc8" stroke-width="3.4" stroke-linecap="round"/>';
      s += ell(cx - R * 0.3, cy - R * 0.42, R * 0.2, R * 0.08, -30, 'rgba(255,255,255,.9)');
    } else if (kind === 'curds') {
      s += fillBase('#f4eedf');
      for (let i = 0; i < 95; i++) { const p = inDisc(r, R - 3), rr = 2.6 + r() * 2.2; s += ell(cx + p[0], cy + p[1] + 0.8, rr, rr * 0.82, r() * 180, '#ddd3bb') + ell(cx + p[0], cy + p[1], rr, rr * 0.82, r() * 180, '#fffdf6'); }
    } else if (kind === 'zoodle' || kind === 'noodle') {
      const a = kind === 'zoodle' ? ['#cfe0a0', '#7fae55', '#e9f0c9'] : ['#f6f1e4', '#e3dac4', '#fffdf6'];
      s += fillBase(a[0]);
      for (let i = 0; i < 26; i++) { const p = inDisc(r, R - 8), rad = 5 + r() * 9, a0 = r() * 360; s += '<circle cx="' + f(cx + p[0]) + '" cy="' + f(cy + p[1]) + '" r="' + f(rad) + '" fill="none" stroke="' + a[1 + Math.floor(r() * 2)] + '" stroke-width="2.2" stroke-dasharray="' + f(rad * 3.4) + ' ' + f(rad * 3) + '" transform="rotate(' + f(a0) + ' ' + f(cx + p[0]) + ' ' + f(cy + p[1]) + ')"/>'; }
    } else if (kind === 'cabbage' || kind === 'redcabbage') {
      const a = kind === 'cabbage' ? ['#d9e8b6', '#b7d38a', '#eef5d6', '#9cc06c'] : ['#8a4a8c', '#a866a8', '#6f3873', '#c9a0c9'];
      s += fillBase(a[0]);
      for (let i = 0; i < 70; i++) { const p = inDisc(r, R - 4), rot = r() * 360; s += g(cx + p[0], cy + p[1], rot, line('M-7 0 Q0 -3 7 0', a[1 + Math.floor(r() * 3)], 1.5)); }
    }
    return '<g clip-path="url(#' + clipId + ')">' + s + '</g>';
  }

  function scatterIn(kind, cx, cy, a0, a1, r0, r1, share, r, hasBed, boost) {
    const spec = SPEC[kind]; if (!spec || !P[kind]) return '';
    const big = spec[0] <= 6, sc = boost || 1;
    let n = Math.max(2, Math.round(spec[0] * share * (hasBed ? 0.95 : 1.9)));
    if (spec[0] <= 2) n = Math.min(spec[0], Math.max(1, Math.round(spec[0] * share * 2.4)));
    else if (big) n = Math.max(kind === 'asparagus' ? 4 : 3, Math.min(spec[0], Math.round(spec[0] * share * 1.8)));
    const pts = [];
    for (let i = 0; i < n; i++) {
      let best = null, bd = -1;
      for (let t = 0; t < 8; t++) {
        const a = a0 + (a1 - a0) * (0.1 + 0.8 * r()), d = r0 + (r1 - r0) * Math.sqrt(0.08 + 0.92 * r());
        const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d;
        let m = 1e9; for (const q of pts) m = Math.min(m, (q[0] - x) * (q[0] - x) + (q[1] - y) * (q[1] - y));
        if (m > bd) { bd = m; best = [x, y, a]; }
      }
      pts.push(best);
    }
    if (big && n > 1) { // fan large pieces neatly
      const am = (a0 + a1) / 2, dm = (r0 + r1) / 2 + 2; pts.length = 0;
      for (let i = 0; i < n; i++) { const off = (i - (n - 1) / 2) * (kind === 'asparagus' ? 4.2 : 7.2); const px = -Math.sin(am), py = Math.cos(am); pts.push([cx + Math.cos(am) * dm + px * off * 0.25 + Math.cos(am) * off * 0.9, cy + Math.sin(am) * dm + py * off * 0.25 + Math.sin(am) * off * 0.9, am]); }
    }
    pts.sort((p, q) => p[1] - q[1]);
    let s = '';
    for (const p of pts) {
      const rot = big ? (p[2] * 180 / Math.PI + 90 + (r() - 0.5) * 14) : r() * 360;
      s += g(p[0], p[1], rot, P[kind](r), spec[1] * sc * (0.92 + r() * 0.16));
    }
    return s;
  }

  function toppings(list, cx, cy, R, r) {
    let s = '';
    for (const t of list) {
      if (t === 'nutbutter') { s += line('M' + f(cx - R * 0.5) + ' ' + f(cy - R * 0.1) + ' q6 -8 12 0 t12 0 t12 0', '#b98148', 3); continue; }
      if (t === 'citrus') { s += g(cx + R * 0.72, cy + R * 0.62, -35, '<path d="M-9 0 A9 9 0 0 1 9 0Z" fill="#f7df5a" stroke="#e0bd2a" stroke-width="1.4"/>' + line('M0 0 L0 -7 M0 0 L-5 -5 M0 0 L5 -5', '#fbf0a8', .9)); continue; }
      if (t === 'salsa' || t === 'hummus' || t === 'redsauce') {
        const c = t === 'hummus' ? ['#e6cf9f', '#cdb27a'] : ['#c9432e', '#e88a6f'];
        const x = cx - R * 0.3 + r() * R * 0.5, y = cy + R * 0.25 + r() * R * 0.2;
        s += ell(x, y, R * 0.34, R * 0.26, r() * 40, c[0]) + circ(x - 3, y - 2, 1.6, c[1]) + circ(x + 4, y + 1, 1.3, c[1]) + (t === 'hummus' ? circ(x + 1, y - 1, 2.2, '#c8963a') : circ(x, y + 3, 1.2, '#7fae55'));
        continue;
      }
      const n = TOP[t]; if (!n || !P[t]) continue;
      for (let i = 0; i < n; i++) { const p = inDisc(r, R - 4); s += g(cx + p[0], cy + p[1], r() * 360, P[t](r)); }
    }
    return s;
  }

  function vessel(kind, id) {
    const defs = '<defs><clipPath id="' + id + '"><circle cx="60" cy="60" r="' + (kind === 'plate' ? 38 : 41) + '"/></clipPath></defs>';
    if (kind === 'plate') return defs + circ(60, 62, 52, 'rgba(15,15,15,.07)') + circ(60, 60, 52, '#ffffff', st('#e3dfd8', 1)) + circ(60, 60, 39.5, '#fbfaf8', st('#ece8e1', 1));
    return defs + circ(60, 62.5, 52, 'rgba(15,15,15,.08)') + circ(60, 60, 52, '#2a2928') + circ(60, 60, 48.5, '#3a3836') + circ(60, 60, 43, '#f1ece2');
  }

  function plateOrBowl(v, name, r, id) {
    const kind = v.v === 'bowl' ? 'bowl' : 'plate';
    const R = kind === 'plate' ? 37 : 41, cx = 60, cy = 60;
    let comps = v.c.slice(), w = v.w.slice();
    const salad = /salad|greens|cobb|slaw|roll-up|lettuce/i.test(name);
    const beds = comps.filter((c) => BED[c] && (c !== 'greens' || salad));
    const tops = comps.filter((c) => TOP[c] || c === 'nutbutter' || c === 'citrus' || c === 'salsa' || c === 'hummus' || c === 'redsauce');
    let items = comps.filter((c) => beds.indexOf(c) < 0 && tops.indexOf(c) < 0 && SPEC[c]);
    let promoted = false;
    if (!items.length && !beds.length) { items = comps.filter((c) => TOP[c] && SPEC[c]).slice(0, 3); promoted = true; }
    let s = vessel(kind, id);
    const hasBed = beds.length > 0;
    if (hasBed) {
      if (kind === 'bowl' || items.length <= 2) s += bed(beds[0], cx, cy, kind === 'plate' ? R - 2 : R, r, id);
      else s += '<g clip-path="url(#' + id + ')">' + bed(beds[0], cx - 9, cy + 4, R - 9, r, id) + '</g>';
      if (beds[1]) s += '<g clip-path="url(#' + id + ')"><g transform="translate(26 -4)">' + bed(beds[1], cx, cy, R * 0.55, r, id) + '</g></g>';
    }
    // special forms
    const sp = v.s;
    if (sp === 'pancake') {
      for (let i = 0; i < 3; i++) s += circ(cx - 3 + i * 3, cy + 5 - i * 5, 24 - i, '#e2a955', st('#b97a2c', 1.2)) + circ(cx - 3 + i * 3, cy + 5 - i * 5, 19 - i, '#eebc6c');
      items = items.filter((c) => PROTEIN.indexOf(c) < 0).slice(0, 2);
      items.forEach((c, i) => { s += scatterIn(c, cx + 3, cy - 5, 0, Math.PI * 2, 0, 14, 0.3, r, true); });
      return s + toppings(tops.filter((t) => t !== 'citrus'), cx + 3, cy - 5, 16, r);
    }
    if (sp === 'muffin') {
      const pos = [[44, 48], [76, 50], [60, 76]];
      pos.forEach((p) => { s += circ(p[0], p[1], 15, '#e9d9b8', st('#cbb88d', 1.2)) + circ(p[0], p[1], 12, v.c.indexOf('egg') >= 0 || v.c.indexOf('eggs') >= 0 ? '#f3cf62' : '#8a5a34'); for (let i = 0; i < 7; i++) { const q = inDisc(r, 9); s += circ(p[0] + q[0], p[1] + q[1], 1.3, ['#d8402f', '#5d9a3a', '#fffdf4', '#3f271b'][Math.floor(r() * 4)]); } });
      return s;
    }
    if (sp === 'ball') {
      const dark = v.c.indexOf('dates') >= 0, veg = v.c.indexOf('cauliflower') >= 0 || v.c.indexOf('caulirice') >= 0;

<script>
(function(){
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const R = Math.round;

// ---------- Mode ----------
const qs = new URLSearchParams(location.search);
const PRACTITIONER = qs.get('practitioner') === '1';
let RX = null; // targets set by the practitioner and sent as a link
try { const m = location.hash.match(/rx=([A-Za-z0-9_\-]+)/); if (m) RX = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) { RX = null; }
if (RX && !(RX.kcal > 0 && RX.p > 0 && LM.PROTOCOLS[RX.protocol])) RX = null;

// ---------- State ----------
const KEY = 'lm_meal_planner_v3';
const blank = { name: '', sex: '', age: '', ft: '', inch: '', lb: '', activity: '', goal: '', screen: [], protocol: '', style: 'simple', meals: 3, snacks: 1, days: 7, exclusions: [], dislikes: [], ov: { kcal: '', p: '', c: '', f: '' }, custom: { kcal: '', p: 30, c: 40, f: 30 } };
let S = Object.assign({}, blank);
if (!RX) { try { const saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved) S = Object.assign({}, blank, saved, { screen: [] }); } catch (e) {} }
if (RX) { S.protocol = RX.protocol; S.name = RX.name || ''; }
if (!S.custom) S.custom = { kcal: '', p: 30, c: 40, f: 30 };
if (!S.style) S.style = 'simple';
function save() { if (RX) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

let step = 0, plan = null, target = null, dayIdx = 0, seed = 0, problem = '';
let chooser = null, cq = '';
let tab = 'plan', dashMode = 'day', dashDate = null, query = '', manualOpen = false, planStart = null, storageOk = true;
const STEPS = RX ? ['Your plan settings', 'Foods to avoid', 'Your plan'] : ['About you', 'How you eat', 'Foods to avoid', 'Your plan'];
const SCREEN = [
  ['pregnant', 'I am pregnant or breastfeeding'],
  ['diabetes', 'I take insulin or medication for diabetes'],
  ['kidney', 'I have kidney disease'],
  ['ed', 'I have a current or past eating disorder'],
  ['minor', 'I am under 18'],
];
$('#modeTag').textContent = PRACTITIONER ? 'Practitioner view' : '';

// ---------- Helpers ----------
function profile() {
  return { sex: S.sex, age: +S.age, heightIn: (+S.ft) * 12 + (+S.inch || 0), weightLb: +S.lb, activity: S.activity, goal: S.goal, protocol: S.protocol || 'balanced' };
}
function profileValid() {
  const p = profile();
  if (!S.sex || !S.activity || !S.goal) return 'Answer every question to continue.';
  if (!(p.age >= 18 && p.age <= 95)) return 'Enter an age between 18 and 95.';
  if (!(p.heightIn >= 54 && p.heightIn <= 84)) return 'Enter a height between 4 ft 6 in and 7 ft.';
  if (!(p.weightLb >= 80 && p.weightLb <= 500)) return 'Enter a weight between 80 and 500 lb.';
  return '';
}
function currentTarget() {
  if (RX) return { kcal: RX.kcal, p: RX.p, c: RX.c, f: RX.f, rx: true };
  let ov = null;
  if (S.protocol === 'custom') {
    const base = LM.computeTargets(profile(), null);
    const kcal = +S.custom.kcal > 0 ? +S.custom.kcal : base.kcal;
    ov = { kcal: kcal, p: Math.round(kcal * (+S.custom.p || 0) / 400), c: Math.round(kcal * (+S.custom.c || 0) / 400), f: Math.round(kcal * (+S.custom.f || 0) / 900) };
  }
  if (PRACTITIONER) { ov = ov || {}; ['kcal', 'p', 'c', 'f'].forEach((k) => { if (+S.ov[k] > 0) ov[k] = +S.ov[k]; }); }
  return LM.computeTargets(profile(), ov);
}
function customProblem() {
  if (S.protocol !== 'custom' || RX) return '';
  const sum = (+S.custom.p || 0) + (+S.custom.c || 0) + (+S.custom.f || 0);
  if (sum !== 100) return 'Protein, carbs, and fat need to add up to 100%. They add up to ' + sum + '%.';
  const t = currentTarget();
  if (PRACTITIONER) return '';
  if (t.kcal < t.calc.floor) return 'Calories below ' + t.calc.floor.toLocaleString() + ' need to be set by your practitioner.';
  if (t.kcal > 6000) return 'Enter calories of 6,000 or less.';
  if (t.p < t.proteinFloorG) return 'Protein works out to ' + t.p + ' g, which is below your minimum of ' + t.proteinFloorG + ' g. Raise the protein percentage.';
  return '';
}
function prefs() { return { protocol: S.protocol, style: S.style, meals: S.meals, snacks: S.snacks, days: S.days, exclusions: S.exclusions.slice(), dislikes: S.dislikes.slice(), seed: 1000 + seed * 7919 }; }
function pct(t) { const e = t.p * 4 + t.c * 4 + t.f * 9; return { p: R(400 * t.p / e), c: R(400 * t.c / e), f: R(900 * t.f / e) }; }
function fmtMult(m) { return ({ 0.5: 'half', 1: '1', 1.5: '1½', 2: '2', 2.5: '2½', 3: '3' })[m] || String(m); }
function pic(x) {
  if (PHOTOS[x.name]) return '<div class="pic"><img src="' + esc(PHOTOS[x.name]) + '" alt="' + esc(x.name) + '" loading="lazy"></div>';
  return '<div class="pic">' + LMART.svg(x) + '</div>';
}
function portionText(e) {
  const x = e.item, m = e.mult || 1;
  if (x.ing) {
    if (x.srv === 1) return m === 1 ? 'Make the recipe as written' : (m === 0.5 ? 'Make half the recipe' : 'Make ' + fmtMult(m) + ' times the recipe');
    return (m === 0.5 ? 'Eat half a serving' : 'Eat ' + fmtMult(m) + (m === 1 ? ' serving' : ' servings')) + ' (recipe makes ' + x.srv + ')';
  }
  return (m === 2 ? '2 × ' : '') + x.portion;
}
function nums(x, m) { return '<span><b>' + R(x.k * m) + '</b> cal</span><span>Protein <b>' + R(x.p * m) + ' g</b></span><span>Carbs <b>' + R(x.c * m) + ' g</b></span><span>Fat <b>' + R(x.f * m) + ' g</b></span>'; }

// ---------- Rendering ----------
function stepsHtml() {
  return '<ol class="steps">' + STEPS.map((s, i) => '<li class="' + (i === step ? 'on' : i < step ? 'done' : '') + '">' + (i + 1) + '<span>. ' + esc(s) + '</span></li>').join('') + '</ol>';
}
function optBtn(group, val, title, sub, cur, center) {
  return '<button type="button" class="opt' + (center ? ' center' : '') + '" data-set="' + group + '" data-val="' + esc(val) + '" aria-pressed="' + (String(cur) === String(val)) + '"><b>' + esc(title) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</button>';
}
function targetPanel(t, who, why) {
  const p = pct(t);
  const m = (cls, g, name, share) => '<div class="macro"><div class="g">' + g + ' g</div><div class="n">' + name + ', ' + share + '%</div><div class="track"><div class="fill ' + cls + '" style="width:' + Math.min(100, share * 1.6) + '%"></div></div></div>';
  return '<section class="target"><div class="who">' + esc(who) + '</div><div class="kcal">' + t.kcal.toLocaleString() + '<small>calories a day</small></div><div class="macros">' + m('p', t.p, 'Protein', p.p) + m('c', t.c, 'Carbs', p.c) + m('f', t.f, 'Fat', p.f) + '</div>' + (why ? '<p class="why">' + why + '</p>' : '') + '</section>';
}

function viewAbout() {
  return '<div class="lead"><h1>Build your meal plan</h1><p>Answer a few questions and get a week of meals sized to your body and your goal. It takes about two minutes.</p></div>' +
  '<div class="card"><h2>Before we start</h2><p class="hint">Check anything that applies to you. Leave them blank if none do.</p>' +
    SCREEN.map((s) => '<label class="check"><input type="checkbox" data-screen="' + s[0] + '"' + (S.screen.indexOf(s[0]) >= 0 ? ' checked' : '') + '><span>' + s[1] + '</span></label>').join('') + '</div>' +
  '<div class="card"><h2>About you</h2><p class="hint">These set your calorie and protein targets.</p>' +
    '<div style="margin-bottom:16px"><label class="f" for="name">First name (optional)</label><input class="inp" id="name" data-f="name" value="' + esc(S.name) + '" autocomplete="given-name"></div>' +
    '<label class="f">Sex, for the calorie formula</label><div class="opts two" style="margin-bottom:16px">' + optBtn('sex', 'female', 'Female', '', S.sex, 1) + optBtn('sex', 'male', 'Male', '', S.sex, 1) + '</div>' +
    '<div class="grid2" style="margin-bottom:16px"><div><label class="f" for="age">Age</label><div class="unit"><input class="inp" id="age" data-f="age" inputmode="numeric" value="' + esc(S.age) + '"><i>yrs</i></div></div>' +
    '<div><label class="f" for="lb">Weight</label><div class="unit"><input class="inp" id="lb" data-f="lb" inputmode="decimal" value="' + esc(S.lb) + '"><i>lb</i></div></div></div>' +
    '<label class="f" for="ft">Height</label><div class="row" style="margin-bottom:4px"><div class="unit"><input class="inp" id="ft" data-f="ft" inputmode="numeric" value="' + esc(S.ft) + '"><i>ft</i></div><div class="unit"><input class="inp" id="inch" data-f="inch" inputmode="numeric" aria-label="Inches" value="' + esc(S.inch) + '"><i>in</i></div></div></div>' +
  '<div class="card"><h2>How active are you?</h2><p class="hint">Pick the one closest to a normal week.</p><div class="opts two stack">' +
    optBtn('activity', 'sedentary', 'Mostly sitting', 'Desk job, little planned exercise', S.activity) +
    optBtn('activity', 'light', 'Lightly active', 'Exercise 1 to 3 days a week', S.activity) +
    optBtn('activity', 'moderate', 'Active', 'Exercise 3 to 5 days a week', S.activity) +
    optBtn('activity', 'very', 'Very active', 'Hard training 6 or 7 days, or a physical job', S.activity) + '</div></div>' +
  '<div class="card"><h2>What is your main goal?</h2><div class="opts three stack" style="margin-top:12px">' +
    optBtn('goal', 'lose', 'Lose body fat', 'A steady calorie deficit with higher protein', S.goal) +
    optBtn('goal', 'maintain', 'Feel and perform better', 'Eat at maintenance', S.goal) +
    optBtn('goal', 'gain', 'Build muscle', 'A small surplus with higher protein', S.goal) + '</div></div>' +
  (problem ? '<p class="err" role="alert">' + esc(problem) + '</p>' : '');
}

function viewStop() {
  return '<div class="lead"><h1>Let’s build this one together</h1><p>Based on what you checked, your plan should be set with Dr. Lazarus rather than by a calculator. Calorie and carbohydrate changes can affect medication, pregnancy, kidney function, and recovery, so the numbers need a clinical review first.</p></div>' +
  '<div class="card"><h2>What to do next</h2><p class="hint" style="margin:8px 0 0">Bring this up at your next visit or message the Lazarus Method team to schedule a nutrition review. Your practitioner can then send you a plan with your targets already set.</p></div>';
}

function protocolCards() {
  return '<div class="opts two stack">' + Object.keys(LM.PROTOCOLS).map((k) => optBtn('protocol', k, LM.PROTOCOLS[k].name, LM.PROTOCOLS[k].desc, S.protocol)).join('') + '</div>';
}
function scheduleCard() {
  return '<div class="card"><h2>Your meals</h2><p class="hint">Your calories are spread across whatever you choose.</p>' +
    '<label class="f">Meal style</label><div class="opts two stack" style="margin-bottom:16px">' + optBtn('style', 'simple', 'Simple', '15 minutes or less, a handful of ingredients', S.style) + optBtn('style', 'cuisine', 'Cuisine', 'Full recipes with more cooking', S.style) + '</div>' +
    '<label class="f">Meals a day</label><div class="opts four" style="margin-bottom:16px">' + [1, 2, 3, 4].map((n) => optBtn('meals', n, String(n), '', S.meals, 1)).join('') + '</div>' +
    '<label class="f">Snacks a day</label><div class="opts three" style="margin-bottom:16px">' + optBtn('snacks', 0, 'None', '', S.snacks, 1) + optBtn('snacks', 1, '1', '', S.snacks, 1) + optBtn('snacks', 2, '2', '', S.snacks, 1) + '</div>' +
    '<label class="f">Plan length</label><div class="opts three">' + optBtn('days', 3, '3 days', '', S.days, 1) + optBtn('days', 5, '5 days', '', S.days, 1) + optBtn('days', 7, '7 days', '', S.days, 1) + '</div></div>';
}
function customCard() {
  const base = LM.computeTargets(profile(), null), kcal = +S.custom.kcal > 0 ? +S.custom.kcal : base.kcal;
  const sum = (+S.custom.p || 0) + (+S.custom.c || 0) + (+S.custom.f || 0);

  if (!(ev.target.dataset.ov || ev.target.dataset.cu)) return;
  // Re-draw the numbers after a field changes, without stealing the cursor from the field the person moved to.
  setTimeout(() => { const act = document.activeElement, id = act && act.id; problem = ''; render(true); if (id) { const n = document.getElementById(id); if (n && n.tagName === 'INPUT') { n.focus(); try { n.select(); } catch (e) {} } } }, 0);
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.id === 'dislike') { ev.preventDefault(); addDislike(ev.target.value); save(); render(true); const d = $('#dislike'); if (d) d.focus(); } });

let reopened = [];
window.addEventListener('beforeprint', () => { reopened = []; document.querySelectorAll('details.recipe:not([open])').forEach((d) => { d.open = true; reopened.push(d); }); });
window.addEventListener('afterprint', () => { reopened.forEach((d) => { d.open = false; }); reopened = []; });
if (loadPlan()) { step = STEPS.length - 1; tab = 'today'; dayIdx = planDayFor(today()); }
render();
})();
</script>
